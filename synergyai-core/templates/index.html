<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYNERGY AI // CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617; /* Un bleu-noir plus profond */
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header h1 {
            font-family: 'Oxanium', sans-serif;
            text-align: center;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 15px;
            margin-bottom: 20px;
            color: #3b82f6;
            font-size: 2.2em; /* Taille augmentée */
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            text-transform: uppercase;
        }

        #chat-container {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #1e293b;
            padding: 20px;
            background: #0f172a;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .message-block {
            margin-bottom: 20px;
            padding: 12px;
            border-left: 4px solid #3b82f6;
            background: rgba(59, 130, 246, 0.03);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .user-label { color: #64748b; font-size: 0.75em; font-weight: bold; margin-bottom: 8px; }
        .ai-label { font-family: 'Oxanium', sans-serif; color: #3b82f6; font-weight: bold; font-size: 0.9em; margin-bottom: 8px; }

        /* Animation de réflexion */
        .thinking {
            display: inline-block;
            font-family: 'Oxanium', sans-serif;
            color: #3b82f6;
            font-size: 0.8em;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
            margin-bottom: 10px;
        }

        @keyframes pulse {
            0% { opacity: 1; text-shadow: 0 0 5px #3b82f6; }
            50% { opacity: 0.3; text-shadow: none; }
            100% { opacity: 1; text-shadow: 0 0 5px #3b82f6; }
        }

        .content { line-height: 1.6; white-space: pre-wrap; font-size: 0.95em; }
        b { color: #60a5fa; } /* Style pour le texte en gras (Markdown) */

        .input-area { margin-top: 20px; }

        input[type="text"] {
            width: 100%;
            background: #1e293b;
            border: 1px solid #3b82f6;
            color: white;
            padding: 15px;
            border-radius: 5px;
            outline: none;
            font-family: inherit;
        }

        button {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 15px;
            font-family: 'Oxanium', sans-serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover { background: #2563eb; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        footer { font-size: 0.7em; color: #334155; text-align: center; margin-top: 15px; font-family: 'Oxanium', sans-serif; }
    </style>
</head>
<body>
    <header>
        <h1>Synergy AI</h1>
    </header>

    <div id="chat-container"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="ENTRER DIRECTIVE..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">EXÉCUTER</button>
    </div>

    <footer>CORE ACTIVE // SYMBIOS-1 // BUILD 2026.99</footer>

    <script>
        function formatMarkdown(text) {
            // Remplace **texte** par <b>texte</b>
            return text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const prompt = input.value.trim();
            if (!prompt) return;

            // Affichage utilisateur
            container.innerHTML += `<div class="message-block"><div class="user-label">USER_INPUT ></div><div class="content">${prompt}</div></div>`;
            input.value = '';

            // Bloc de réponse IA avec indicateur de réflexion
            const aiBlock = document.createElement('div');
            aiBlock.className = 'message-block';
            aiBlock.innerHTML = `
                <div class="ai-label">SYNERGY_AI_CORE</div>
                <div class="thinking" id="status">ANALYSE EN COURS...</div>
                <div class="content" id="latest-response"></div>`;
            container.appendChild(aiBlock);
            
            const responseDisplay = document.getElementById('latest-response');
            const statusIndicator = document.getElementById('status');
            let fullText = "";

            const eventSource = new EventSource(`/ask?prompt=${encodeURIComponent(prompt)}`);

            eventSource.onmessage = function(event) {
                // Dès qu'on reçoit du texte, on cache l'indicateur "Analyse"
                if(statusIndicator) statusIndicator.style.display = 'none';
                
                fullText += event.data;
                // On applique le formatage Markdown au fur et à mesure
                responseDisplay.innerHTML = formatMarkdown(fullText);
                container.scrollTop = container.scrollHeight;
            };

            eventSource.onerror = function() {
                eventSource.close();
                if(statusIndicator) statusIndicator.style.display = 'none';
                responseDisplay.removeAttribute('id');
            };
        }
    </script>
</body>
</html>
