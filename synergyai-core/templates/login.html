<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #12141a; color: #4a90e2; font-family: 'Oxanium', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        form { background: #1c1f26; padding: 3rem; border-radius: 4px; border: 1px solid #4a90e2; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        h2 { letter-spacing: 3px; margin-bottom: 20px; }
        input { display: block; margin: 10px auto; padding: 12px; width: 250px; background: #0d0f14; border: 1px solid #2d323d; color: #00ff41; font-family: 'Oxanium'; }
        button { background: #4a90e2; color: white; border: none; padding: 12px; width: 275px; cursor: pointer; font-family: 'Oxanium'; font-weight: bold; margin-top: 10px; }
        button:hover { background: #00ff41; color: #12141a; }
    </style>
</head>
<body>
    <form method="post">
        <h2>SYNERGY AI // AUTH</h2>
        <input type="text" name="username" placeholder="IDENTIFIANT" required>
        <input type="password" name="password" placeholder="CODE SECRET" required>
        <button type="submit">INITIALISER</button>
    </form>
</body>
</html>
